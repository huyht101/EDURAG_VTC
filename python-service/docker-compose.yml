services:
  rag-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
      - OCR_MODE=${OCR_MODE:-OFF}
      - OCR_NATIVE_TEXT_MIN_CHARS=${OCR_NATIVE_TEXT_MIN_CHARS:-32}
      - OCR_TIMEOUT_SECONDS=${OCR_TIMEOUT_SECONDS:-120}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-vi}
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      - ACTIVATION_MAX_ATTEMPTS=${ACTIVATION_MAX_ATTEMPTS:-3}
      - ACTIVATION_RETRY_DELAY_SECONDS=${ACTIVATION_RETRY_DELAY_SECONDS:-0.25}
    depends_on:
      - qdrant
    volumes:
      - .:/app
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
